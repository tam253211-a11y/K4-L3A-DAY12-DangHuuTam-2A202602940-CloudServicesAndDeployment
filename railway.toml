# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD của Dockerfile
#   sh -c "exec uvicorn ... --port ${PORT:-8000}"
# startCommand của Railway chạy dạng exec, không qua shell → `$PORT` không được
# thay giá trị, và uvicorn không phải PID 1 → không nhận SIGTERM (CP4).
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
